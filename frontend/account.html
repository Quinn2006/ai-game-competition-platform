<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>账号中心 · AI 小游戏</title><link rel="stylesheet" href="/account/style.css"><script type="module" src="/account/app.mjs"></script><link rel="stylesheet" href="/community/style.css"></head>
<body><header><a href="/account" class="brand">AI 小游戏<span>创作 · 试玩 · 相遇</span></a><span class="tag">账号中心</span></header>
<main><aside><p class="eyebrow">PLAYER SPACE</p><h1>下一场灵感，<br>从这里开始。</h1><p>管理你的身份与公开资料。<br>把创作留给世界，把隐私留给自己。</p><div class="art" aria-hidden="true"><div class="tile">PLAY</div><div class="orb"></div><div class="grid"></div></div><p class="note">公开主页仅展示昵称、头像与简介，<br>不会展示邮箱或学生身份资料。</p></aside>
<section class="panel" aria-label="账号操作"><nav id="nav" aria-label="账号导航"><button data-view="login" class="selected">登录</button><button data-view="register">注册</button><button data-view="forgot">找回密码</button></nav>
<div id="message" role="status" aria-live="polite"></div><div id="content"></div><footer>账号安全由你掌握。请勿向他人提供密码或验证码。</footer></section></main>
<template id="login"><h2>欢迎回来</h2><p>登录后继续你的创作旅程。</p><form data-action="login"><label>邮箱<input name="email" type="email" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><details><summary>已开启两步验证？</summary><label>动态验证码<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}"></label><label>或使用一次性恢复码<input name="recovery" autocomplete="off"></label></details><button class="primary">登录账号</button></form></template>
<template id="register"><h2>加入创作</h2><p>邮箱仅作为唯一账号名，无需验证。账号保存在本机，注册后即可登录。</p><form data-action="register"><label>邮箱<input name="email" type="email" autocomplete="email" required></label><label>设置密码<input name="password" type="password" autocomplete="new-password" required></label><p class="hint">15—128 个字符，支持空格与中文，无需强制组合大小写和符号。</p><button class="primary">创建本地账号</button></form></template>
<template id="forgot"><h2>找回密码</h2><p>请联系运行此平台的本机管理员重置密码。邮箱仅是账号名，不发送重置邮件。管理员两步验证保持有效。</p><button class="text" data-view="login">返回登录</button></template>

<template id="profile"><h2>个人资料</h2><p id="email"></p><form data-action="profile"><label>公开昵称<input name="nickname" required></label><label>个人简介<textarea name="bio" rows="4"></textarea></label><button class="primary">保存资料</button></form><div class="actions"><button data-view="security">账号安全</button><button data-view="delete">注销账号</button><button id="logout">退出登录</button></div><div id="admin-entry"></div></template>
<template id="security"><h2>两步验证</h2><p>使用验证器应用，输入密钥后生成动态验证码。管理员必须开启。</p><form data-action="mfa/setup"><label>当前密码<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">生成验证器密钥</button></form><div id="enroll"></div><button class="text" data-view="profile">返回资料</button></template>
<template id="delete"><h2>注销账号</h2><p>提交后立即退出所有会话，7 天后删除账号资料与收藏。等待期内可联系本机管理员取消。</p><p>评论将匿名化保留，普通作品下架；参赛作品与必要材料按赛事留存规则处理。在任队长需先移交。</p><form data-action="delete"><label>当前密码<input name="password" type="password" autocomplete="current-password" required></label><label>动态验证码（已开启两步验证时）<input name="code" inputmode="numeric" autocomplete="one-time-code"></label><label class="check"><input name="confirmed" type="checkbox" required>我理解并确认申请注销</label><button class="danger">申请注销</button></form><button class="text" data-view="profile">返回资料</button></template>
<template id="admin"><h2>管理员敏感资料访问</h2><p>此操作需要重新验证，并留下审计记录。</p><form data-action="revalidate"><label>目标账号 ID<input name="resourceId" required></label><label>管理员密码<input name="password" type="password" autocomplete="current-password" required></label><label>动态验证码<input name="code" inputmode="numeric" autocomplete="one-time-code" required></label><button class="primary">验证并查看</button></form><pre id="admin-result"></pre><button class="text" data-view="profile">返回资料</button></template>
<template id="roles"><h2>调整账号角色</h2><p>仅管理员可操作。目标账号的现有会话将撤销，新增管理员下次登录必须完成两步验证。</p><form data-action="revalidate" data-operation="roles"><label>目标账号 ID<input name="resourceId" required></label><label>新角色<select name="roles"><option value="">普通用户</option><option value="judge">评委</option><option value="admin">管理员</option></select></label><label>管理员密码<input name="password" type="password" autocomplete="current-password" required></label><label>动态验证码<input name="code" inputmode="numeric" autocomplete="one-time-code" required></label><label class="check"><input type="checkbox" name="confirmed" required>确认修改该账号权限并撤销其会话</label><button class="danger">验证并变更角色</button></form><button class="text" data-view="profile">返回资料</button></template>
<p><a href="/favorites">我的收藏</a></p></body></html>
