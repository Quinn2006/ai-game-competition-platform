name: foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app_test
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: ai_games_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_test -d ai_games_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:baseline
      - run: npm test
      - run: node scripts/ops-local-load.mjs
      - run: npm run test:postgres
        env:
          APP_ENV: test
          DATABASE_URL: postgres://app_test:ci-disposable-password@127.0.0.1:5432/ai_games_test
          CONFIRM_DISPOSABLE_DATABASE: ai_games_test
