<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>发现游戏 · AI 小游戏实验场</title><link rel="stylesheet" href="/catalog/style.css"><script type="module" src="/catalog/ui.mjs"></script></head>
<body><a class="skip" href="#main">跳至内容</a><header><a class="brand" href="/">小游戏实验场<span>PLAY SOMETHING NEW</span></a><nav aria-label="主导航"><a href="/">发现</a><a href="/rankings">排行榜</a><a href="/studio">创作台</a><a href="/account">我的账号</a></nav></header>
<main id="main"><div class="heading"><div><p class="eyebrow">独立创意 / 即点即玩</p><h1 id="title">发现下一份灵感</h1></div><p id="intro">从一个小小的想法，开始一场新的冒险。</p></div>
<section id="browse" aria-label="搜索与筛选"><form id="search"><label for="query">搜索游戏</label><div class="search-row"><input id="query" name="q" maxlength="100" type="search" placeholder="名称、作者、团队、标签或简介"><button class="primary">搜索</button></div></form><div class="terms"><span>热门搜索</span><div id="hot"></div></div><details><summary>最近搜索</summary><div id="history"></div><button id="clear" type="button">清空历史</button><p id="history-note" class="muted"></p></details>
<div class="filters"><label>分类<select id="category"><option value="">全部分类</option></select></label><label>排序<select id="sort"><option value="latest">最新发布</option><option value="likes">点赞最多</option><option value="plays">有效试玩最多</option><option value="duration" disabled>平均有效游玩时长最长 · 暂未开放</option><option value="popularity">综合人气最高</option></select></label></div><p class="muted">平均有效时长排序将在试玩统计接入后开放。</p></section>
<p id="status" role="status" aria-live="polite"></p><button id="retry" hidden>重新加载</button>
<section id="profile" hidden></section><section id="detail" hidden></section>
<section id="featured-section" hidden><h2>编辑精选</h2><div id="featured" class="grid"></div></section>
<section id="results-section"><div class="section-head"><h2 id="results-title">全部游戏</h2><span class="muted" id="count"></span></div><div id="results" class="grid"></div><div class="load"><button id="more" hidden>加载更多</button></div></section>
<section id="editor" class="panel" hidden><h2>作品公开资料</h2><p>仅作品所有者可以保存。未通过发布审核的作品不会公开展示。</p><form id="edit-form"><label>作品 ID<input name="workId" required></label><label>名称<input name="title" maxlength="100" required></label><label>完整简介<textarea name="summary" maxlength="10000" rows="8" required></textarea></label><label>操作说明<textarea name="instructions" maxlength="5000" rows="5" required></textarea></label><label>主分类<select name="category" id="edit-category"></select></label><label>标签（逗号分隔，最多 10 个）<input name="tags"></label><button class="primary">保存公开资料</button></form></section>
<section id="admin" class="panel" hidden><h2>发现页设置</h2><form id="settings-form"><label>每批数量（1—60）<input name="batchSize" type="number" min="1" max="60" value="12" required></label><label>热门搜索屏蔽词（一行一个）<textarea name="blockedTerms" rows="5"></textarea></label><button class="primary">保存设置</button></form><h2>编辑精选</h2><form id="feature-form"><label>作品 ID<input name="workId" required></label><label>精选状态<select name="featured"><option value="true">加入精选</option><option value="false">移出精选</option></select></label><button>更新精选</button></form></section>
</main><footer>AI 小游戏实验场 · 每一种创意，都值得被试玩。</footer></body></html>
